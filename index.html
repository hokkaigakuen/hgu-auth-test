<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HGU-Lab 認証テスト</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e9f1ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:650px;margin:40px auto;padding:22px}.panel{background:#15233a;border:1px solid #304460;border-radius:16px;padding:24px}h1{font-size:1.5rem}p{line-height:1.7;color:#b7c8df}button{border:0;border-radius:9px;padding:13px 18px;margin:6px 6px 6px 0;background:#4d8df7;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}#logout{background:#435570}pre{white-space:pre-wrap;word-break:break-all;background:#0b1627;padding:14px;border-radius:8px;line-height:1.7}small{color:#9db1ce}
</style>
</head>
<body><main><section class="panel"><h1>HGU-Lab｜認証テスト</h1><p>Firebase Googleログインと、Firestoreの承認情報を読み取り専用で確認します。</p><button id="login" disabled>Googleでログイン</button><button id="logout" disabled>ログアウト</button><pre id="status">初期化中…</pre><small>UIDやIDトークンを他人に送らないでください。招待コード入力・承認登録はこのテストでは行いません。</small></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={
 apiKey:'AIzaSyDvIAyFiOLfScIu8-NPQSevfpw1BJw7hA4',
 authDomain:'hug-baseball-data.firebaseapp.com',
 projectId:'hug-baseball-data',
 storageBucket:'hug-baseball-data.firebasestorage.app',
 messagingSenderId:'28963444862',
 appId:'1:28963444862:web:549f3e75ff84843a81202f',
 measurementId:'G-X0JC6MMM2E'
};
const $=id=>document.getElementById(id);const show=s=>$('status').textContent=s;
try{
 const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
 const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
 $('login').onclick=async()=>{try{show('Googleログイン処理中…');await signInWithPopup(auth,provider)}catch(e){show('ログイン失敗: '+e.code+'\n'+e.message)}};
 $('logout').onclick=async()=>{try{await signOut(auth)}catch(e){show('ログアウト失敗: '+e.message)}};
 onAuthStateChanged(auth,async user=>{
  $('login').disabled=!!user;$('logout').disabled=!user;
  if(!user){show('未ログインです。Googleでログインを押してください。');return}
  show('ログイン成功\nメール: '+(user.email||'不明')+'\nUID: '+user.uid+'\n承認状態: 確認中…');
  try{const snap=await getDoc(doc(db,'approvedUsers',user.uid));
   if(snap.exists()){
    const d=snap.data();show('ログイン成功\nメール: '+(user.email||'不明')+'\nUID: '+user.uid+'\n承認情報: あり\napproved: '+String(d.approved===true)+'\nrole: '+String(d.role||'未設定'));
   }else{show('ログイン成功\nメール: '+(user.email||'不明')+'\nUID: '+user.uid+'\n承認情報: なし（未承認）')}
  }catch(e){show('ログイン成功\nメール: '+(user.email||'不明')+'\nUID: '+user.uid+'\n承認情報の確認に失敗: '+e.code+'\n※ Firestoreルールの公開状態も確認が必要です。')}
 },e=>show('認証状態の取得に失敗: '+e.message));
}catch(e){show('初期化エラー: '+e.message)}
</script></body></html>
